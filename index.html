<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="build" content="1794384649">
<title>DS DEPARTMENT</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap">

</head>
<body>
<style>
/* Layout: control-room planning board — KPI strip, then a Gantt timeline (default) or a participation matrix; every course carries its own hue across both views */
html{box-sizing:border-box}body{margin:0}
:root{
  --bg:#080c14; --surface:#0e1420; --raise:#141c2b; --sunk:#0b101a; --ink:#e9eef8; --muted:#8a96ac; --faint:#4b5770; --line:#1c2638; --line2:#253149;
  --accent:#6d8dff; --accent2:#2fd4f0; --on-c:#071019;
  --ok:#3ddc97; --ok-bg:#0f2a21; --warn:#f5b54a; --warn-bg:#2d2312; --bad:#ff6b7d; --bad-bg:#30151c;
  --hatch:rgba(140,160,200,.07); --glow:0 0 0 1px rgba(109,141,255,.15),0 20px 60px -20px rgba(47,212,240,.18);
  --f:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3f5fa; --surface:#ffffff; --raise:#f7f9fd; --sunk:#f0f3f9; --ink:#0b1324; --muted:#5d6880; --faint:#a3adc0; --line:#e4e9f2; --line2:#d6deeb;
  --accent:#3d63f0; --accent2:#0ba5c4; --on-c:#071019;
  --ok:#14915c; --ok-bg:#e1f5ec; --warn:#b97a07; --warn-bg:#fcf1db; --bad:#d23a4f; --bad-bg:#fbe5e8;
  --hatch:rgba(60,80,120,.06); --glow:0 1px 2px rgba(11,19,36,.05),0 16px 40px -16px rgba(61,99,240,.18);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f5fa; --surface:#ffffff; --raise:#f7f9fd; --sunk:#f0f3f9; --ink:#0b1324; --muted:#5d6880; --faint:#a3adc0; --line:#e4e9f2; --line2:#d6deeb;
  --accent:#3d63f0; --accent2:#0ba5c4; --on-c:#071019;
  --ok:#14915c; --ok-bg:#e1f5ec; --warn:#b97a07; --warn-bg:#fcf1db; --bad:#d23a4f; --bad-bg:#fbe5e8;
  --hatch:rgba(60,80,120,.06); --glow:0 1px 2px rgba(11,19,36,.05),0 16px 40px -16px rgba(61,99,240,.18);
  color-scheme:light}
*{font-family:var(--f)}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 400px at 85% -10%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%),radial-gradient(700px 300px at 0% 0%,color-mix(in srgb,var(--accent2) 9%,transparent),transparent 70%);background-repeat:no-repeat}
.wrap{max-width:none;margin:0 auto;padding-block:40px 72px;padding-left:max(clamp(16px,3vw,48px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,3vw,48px),env(safe-area-inset-right,0px));display:grid;gap:28px}
button,input,select,textarea{font:inherit;font-family:var(--f);color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.num,.tn{font-variant-numeric:tabular-nums}

/* header */
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--muted)}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--accent2)}
h1{font-size:clamp(30px,5.2vw,46px);font-weight:900;letter-spacing:-.02em;margin:6px 0 0;line-height:1.02;text-wrap:balance}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
header>.hright{order:1}header>.today{order:2}header>.htitle{order:3;text-align:left;margin-right:auto}
@media (max-width:700px){header>.htitle{order:0;width:100%}}
h1 em{letter-spacing:.01em}
.hright{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.status{font-size:13px;color:var(--muted);min-width:1px}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:11px;padding:9px 16px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--faint)}
.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--accent2)));border-color:transparent;color:#fff;font-weight:700;box-shadow:0 8px 24px -10px var(--accent)}
.primary:hover:not(:disabled){filter:brightness(1.08);border-color:transparent}
.danger{color:var(--bad);border-color:transparent;background:transparent}
.danger.armed{background:var(--bad);color:#fff}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 16px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line2)}
.seg.sm button{padding:5px 12px;font-size:13px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;display:grid;gap:6px;min-width:0}
.kpi .k{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-size:28px;font-weight:800;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:500}
.kpi .s{font-size:12px;color:var(--faint)}
.kpi.alert .v{color:var(--bad)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

.note{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:12px;padding:10px 14px;font-size:14px}
.board{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--glow);overflow:hidden}
.loading,.emptyrow{padding:36px 22px;color:var(--muted);font-size:14px;text-align:start}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:12px;align-items:center}
.legend span{display:inline-flex;gap:7px;align-items:center}
.lg{width:14px;height:14px;border-radius:5px;display:inline-block;box-sizing:border-box}
.lg.ok{background:var(--ok-bg);box-shadow:inset 0 0 0 1px var(--ok)}
.lg.mid{background:var(--warn-bg);box-shadow:inset 0 0 0 1px var(--warn)}
.lg.low{background:var(--bad-bg);box-shadow:inset 0 0 0 1px var(--bad)}
.lg.on{border-radius:50%;background:var(--accent)}
.lg.cl{border-radius:50%;border:1.5px dashed var(--warn)}
.cnt{display:inline-flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:999px;padding:1px 9px 1px 8px;font-size:11px;font-weight:700;letter-spacing:0;font-variant-numeric:tabular-nums}
.cnt b{font-size:12px;font-weight:800}
.chip{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:6px;padding:0 5px}

/* ---------- gantt ---------- */
.gscroll{overflow-x:auto}
.gantt{--dw:30px;--lw:330px;width:max-content;min-width:100%;position:relative}
.grow{display:grid;grid-template-columns:var(--lw) var(--cols);grid-template-rows:56px;position:relative}
.grow+.grow{border-top:1px solid var(--line)}
.glabel{grid-column:1;grid-row:1 / -1;position:sticky;inset-inline-start:0;z-index:4;background:var(--surface);border-inline-end:1px solid var(--line);padding:6px 16px;display:flex;align-items:center;gap:12px;min-width:0;box-sizing:border-box}
.glabel .tx{display:flex;flex-direction:column;min-width:0;flex:1}
.glabel .tx{gap:3px}
.gl-main .tx b,.gl-main .tx small{white-space:normal;line-height:1.35}
.glabel b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glabel small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glabel b small{display:inline;font-size:inherit;color:var(--muted);font-weight:400}
.dot{width:10px;height:10px;border-radius:3px;background:var(--c);box-shadow:0 0 12px var(--c);flex:none}
.av{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--raise);border:1px solid var(--line2);flex:none;color:var(--muted)}
button.glabel{border:0;border-inline-end:1px solid var(--line);text-align:start;border-radius:0}
button.glabel:hover:not(:disabled){background:var(--raise)}
.gantt{--gw:24px}
.gw{background:repeating-linear-gradient(135deg,var(--line2) 0 1px,transparent 1px 6px)!important;opacity:.7}
.gwd{display:grid;place-items:end center;padding-bottom:10px}
.gwd em{writing-mode:vertical-rl;font-style:normal;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.wk{grid-row:1 / -1;z-index:0;background:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 7px)}
.wl{grid-row:1 / -1;z-index:0;border-inline-start:1px solid var(--line)}
.wl.gp{border-inline-start:1px solid var(--line2)}
.gd.ws{border-inline-start:1px solid var(--line2)}
.wl.jp,.gd.jp{border-inline-start:2px dashed var(--faint)}
.tdy{grid-row:1 / -1;z-index:3;pointer-events:none;justify-self:center;width:2px;background:linear-gradient(var(--accent2),color-mix(in srgb,var(--accent2) 30%,transparent));box-shadow:0 0 12px var(--accent2)}
.gbar{z-index:2;align-self:center;height:40px;margin:0 3px;border-radius:12px;padding:0 10px;font-size:12px;font-weight:600;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--ink);
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 30%,var(--surface)),color-mix(in srgb,var(--c) 18%,var(--surface)));border:1px solid color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 6px 20px -10px var(--c),inset 0 1px 0 color-mix(in srgb,#fff 10%,transparent);display:flex;align-items:center;gap:6px}

.gbar span{white-space:nowrap}
.crow .gbar{height:28px;overflow:visible;padding-inline:4px 6px;gap:6px;font-size:12px;cursor:pointer}
.gbar .x{flex:none;margin-inline-start:auto;width:22px;height:22px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1;display:grid;place-items:center;position:relative;z-index:4}
.gbar .x:hover{background:var(--bad-bg);color:var(--bad)}
.gadd{z-index:2;align-self:center;justify-self:start;height:30px;padding:0 12px;border-radius:999px;border:1px dashed color-mix(in srgb,var(--c) 55%,var(--faint));background:transparent;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;margin-inline-start:3px}
.gadd:hover{color:var(--ink);border-style:solid;background:color-mix(in srgb,var(--c) 12%,transparent)}
.glabel small.ex{color:var(--warn);white-space:normal;line-height:1.35}
.gl-main{flex:1;min-width:0;display:flex;align-items:center;gap:14px;background:transparent;border:0;padding:6px 0;text-align:start;color:inherit;border-radius:10px}
.gl-main:hover:not(:disabled) b{color:var(--accent2)}
button:disabled{opacity:1;color:inherit}
.gl-add{flex:none;width:28px;height:28px;border-radius:11px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--ink);font-size:20px;font-weight:500;line-height:1;display:grid;place-items:center;box-shadow:0 4px 14px -6px var(--c)}
.gl-add:hover{background:var(--c);color:var(--on-c)}
.nodate{z-index:2;align-self:center;justify-self:start;height:34px;margin-inline-start:6px;padding:0 16px;border-radius:999px;border:1px dashed color-mix(in srgb,var(--c) 55%,var(--faint));background:color-mix(in srgb,var(--c) 6%,transparent);color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}
.nodate:hover:not(:disabled){color:var(--ink);border-style:solid}
.dur{display:inline-block;font-size:11px;font-weight:700;color:var(--ink);background:color-mix(in srgb,var(--c) 18%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:6px;padding:0 6px;margin-inline-end:4px;line-height:1.6}
.dur:empty{display:none}
.sect{margin:10px 0 -12px;font-size:18px;font-weight:800;letter-spacing:-.01em}
.gsep{height:30px;border-top:2px solid var(--line2);border-bottom:1px solid var(--line)}
.gsep span{font-size:11px}
.qinfo{margin:-4px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--c) 8%,var(--sunk));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line2))}
.qinfo div{min-width:0}
.qinfo dt{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.qinfo dd{margin:2px 0 0;font-size:14px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
@media (max-width:480px){.qinfo{grid-template-columns:1fr}}
.qdet{white-space:pre-wrap;font-size:13px;line-height:1.65;color:var(--ink);padding:12px 14px;border-radius:14px;background:var(--sunk);border:1px solid var(--line2);max-height:240px;overflow:auto;margin-top:-6px}
.qdet a{color:var(--accent2);word-break:break-all}
.sheet textarea{border:1px solid var(--line2);border-radius:11px;padding:10px 12px;background:var(--sunk);color:var(--ink);width:100%;box-sizing:border-box;resize:vertical;font:inherit;font-size:14px;line-height:1.5}
.qedit{margin-top:-8px}
.qedit .btn{padding:6px 12px;font-size:13px}
.bulk{display:flex;flex-wrap:wrap;gap:8px;margin-top:-6px}
.bulk .qe{margin-inline-start:auto}
.bulk .btn{padding:7px 14px;font-size:13px}
.bulk .btn:disabled{opacity:.45}
.crow .gbar.allb{padding-inline:4px;gap:0;font-size:10.5px;font-weight:700;justify-content:center}
.gbar.allb i{display:none}
.gbar.allb i svg{width:11px!important;height:11px!important}
.gbar i.grp svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.gbar i.grp svg circle{fill:currentColor;stroke:none}
.allpill{z-index:3;align-self:center;justify-self:center;height:30px;padding:0 14px;border:0;border-radius:999px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px;font-weight:800;color:var(--on-c);background:var(--c);box-shadow:0 6px 18px -6px var(--c);cursor:pointer;transition:transform .15s}
.allpill svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.allpill svg circle{fill:currentColor;stroke:none}
.allpill:hover{transform:translateY(-1px)}
.allpill.past{opacity:.45}
@media (prefers-reduced-motion:reduce){.allpill{transition:none}.allpill:hover{transform:none}}
.allbar{height:30px!important;padding:0!important;justify-content:center;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 55%,var(--accent2)))!important;border:0!important;box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 60%,transparent),0 0 22px -4px var(--c)!important}
.allbar::after{display:none}
.allbar span{font-size:11px;font-weight:900;color:var(--on-c);letter-spacing:.04em}
.alltag{z-index:3;align-self:center;justify-self:start;margin-inline-start:8px;display:inline-flex;align-items:center;gap:8px;height:32px;padding-inline:4px 8px;border-radius:999px;background:var(--surface);border:1px solid color-mix(in srgb,var(--c) 65%,transparent);box-shadow:0 6px 20px -8px var(--c);white-space:nowrap;cursor:pointer;position:relative}
.alltag::before{content:"";position:absolute;inset-inline-start:-9px;top:50%;width:8px;border-top:1.5px dashed color-mix(in srgb,var(--c) 70%,transparent)}
.alltag.over{margin-inline-start:4px}.alltag.over::before{display:none}
.alltag b{font-size:13px;font-weight:800;color:var(--ink)}
.alltag em{font-style:normal;font-size:11px;font-weight:700;color:var(--ink);background:color-mix(in srgb,var(--c) 22%,transparent);border-radius:999px;padding:1px 8px}
.allic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--c) 60%,#fff),var(--c));box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent),0 0 14px -2px var(--c)}
.allic svg{width:15px;height:15px;fill:none;stroke:var(--on-c);stroke-width:2;stroke-linecap:round}
.allic svg circle{fill:var(--on-c);stroke:none}
.alltag .stack i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:800;color:var(--on-c);background:var(--c);border:2px solid var(--surface)}
.alltag .stack i.more{background:var(--raise);color:var(--ink)}
.alltag .x{width:22px;height:22px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:15px;display:grid;place-items:center}
.alltag .x:hover{background:var(--bad-bg);color:var(--bad)}
.alltag.past,.allbar.past{opacity:.45}
.stack{display:inline-flex;flex:none}
.stack i{margin-inline-start:-8px;border:2px solid var(--surface)}
.stack i:first-child{margin-inline-start:0}
.stack i.more{background:var(--raise);color:var(--ink);font-size:9px}
.skpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:640px}
.slist th{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-align:start;padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.slist td{padding:10px 16px;text-align:start;white-space:nowrap;font-size:14px;vertical-align:middle}
.slist tbody tr+tr td{border-top:1px solid var(--line)}
.slist tbody tr:hover td{background:var(--raise)}
.slist td.sc1{padding:4px 8px;min-width:280px}
.slist td.sc1 .gl-main{width:100%}
.slist .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.slist .tx b{font-size:15px;font-weight:700}
.slist .tx small{font-size:12px;color:var(--muted)}
.slist td.n{font-variant-numeric:tabular-nums;font-weight:600}
.slist td.strong{font-weight:800}
.slist td.na{color:var(--faint);font-weight:500}
.slist td.act{width:40px}
.slist td.ppl{white-space:normal;min-width:220px}
.slist td.ppl .pchip{margin:2px 0 2px 6px}
.slist td.ppl .na{color:var(--faint);font-size:13px}
.slist .tn{font-variant-numeric:tabular-nums;margin-inline-start:6px}
.slist tfoot td{border-top:2px solid var(--line2);background:var(--sunk);font-weight:800;padding:14px 16px}
.slist tfoot small{font-weight:500;color:var(--muted)}
.skpi>div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 22px;display:grid;gap:4px}
.skpi span{font-size:12px;color:var(--muted);font-weight:500}
.skpi b{font-size:30px;font-weight:900;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.1}
.skpi small{font-size:12px;color:var(--faint)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:16px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 22px;display:grid;gap:16px;box-shadow:var(--glow);position:relative;overflow:hidden;align-content:start}
.scard::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 30%,transparent))}
.scard header{display:flex;align-items:center;gap:12px}
.scard h3{margin:0;font-size:18px;font-weight:800;flex:1;min-width:0;line-height:1.3}
.sdates{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:14px}
.sdates b{font-weight:700;font-variant-numeric:tabular-nums}
.sdates .loc{color:var(--muted);font-size:13px}

<div dir="rtl" class="wrap" id="app"><div class="board"><div class="loading">טוען את הנתונים…</div></div></div>
<script>
(function(){
const TEAMS=["צוות א","צוות ב"];
const HUES=["#6d8dff","#2fd4f0","#a98bff","#3ddc97","#f5b54a","#ff7ab6","#5cc8ff","#ff9f68"];
const S={people:[],courses:[],projects:[],info:[],loaded:{p:false,c:false}};
const ui={view:"gantt",gmode:"course",status:"",sheet:null,armed:false,err:"",canWrite:true,dbState:"loading",scrolled:false,clearArmed:false};
const VIEWS=["summary","people","projects","info"];const hashView=()=>{const h=location.hash.slice(1);return VIEWS.includes(h)&&(h!=="people"||ui.peopleTab!==false)?h:"gantt"};
ui.view=hashView();
window.addEventListener("hashchange",()=>{ui.view=hashView();ui.scrolled=false;render()});
let db=null;
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const D=s=>new Date(s+"T12:00");
const TODAY=iso(new Date());
const addDays=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((D(b)-D(a))/864e5);
const endOf=c=>c.end&&c.end>=c.start?c.end:c.start;
const overlap=(a,b)=>a.start&&b.start&&a.start<=endOf(b)&&b.start<=endOf(a);
const days=c=>c.start?diff(c.start,endOf(c))+1:0;
const isWE=s=>{const w=D(s).getDay();return w===5||w===6};
const workdays=c=>{if(!c.start)return 0;let n=0;for(let d=c.start;d<=endOf(c);d=addDays(d,1))if(!isWE(d))n++;return n};
const dur=c=>{const w=workdays(c);if(!w)return"";return w+" "+(w===1?"יום":"ימים")};
const fd=s=>D(s).toLocaleDateString("he-IL",{day:"numeric",month:"short"});
const linkify=t=>esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
const money=n=>Math.round(n).toLocaleString("he-IL")+" ₪";
const dmy=s=>(+s.slice(8))+"."+(+s.slice(5,7));
const range=c=>{if(!c.start)return"ללא תאריך";const e=endOf(c);return e===c.start?dmy(c.start):dmy(c.start)+"–"+dmy(e)};
const parts=c=>Object.keys(c.people||{}).filter(k=>c.people[k]);
const has=(c,pid)=>!!(c.people&&c.people[pid]);
const firstName=n=>String(n).split(" ")[0];
const initials=n=>String(n).split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("");
const hue=id=>{let h=0;for(const ch of String(id))h=(h*31+ch.charCodeAt(0))>>>0;return HUES[h%HUES.length]};
const CHECK='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const dis=()=>ui.canWrite?"":" disabled";
const WD=["א","ב","ג","ד","ה","ו","ש"];
const nameHtml=n=>{const[f,...r]=String(n).split(" ");return `${esc(f)}${r.length?` <small>${esc(r.join(" "))}</small>`:""}`};
const cntHtml=n=>`<span class="cnt"><b>${n}</b> אנשים</span>`;
const sampleHtml=c=>c.sample?' <span class="chip">דוגמה</span>':"";

/* ---------- data ---------- */
const chains={};
let toastT=null;
function toast(msg,kind,perm){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t)}
  t.className="toast "+(kind||"");t.innerHTML=`<span>${esc(msg)}</span>${perm?'<button type="button" id="toast-perm">פתח הרשאות</button>':""}`;t.hidden=false;
  const pb=document.getElementById("toast-perm");if(pb)pb.onclick=async()=>{try{const pm=await claude.use("permissions");if(pm)await pm.manage()}catch(e){}};
  clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},kind==="bad"?12000:2200)}
function write(path,fn){ui.status="שומר…";setStatus();const p=(chains[path]||Promise.resolve()).then(fn).then(()=>{ui.status="";setStatus();toast("נשמר ✓","ok")}).catch(err=>{
  const c=(err&&err.code)||"unknown";ui.status="";setStatus();
  if(c==="invalid_argument")toast("השמירה נדחתה: כנראה שאין לך הרשאת עריכה בעמוד הזה.","bad");
  else if(c==="not_granted")toast("העמוד עדיין לא קיבל אישור לשמור נתונים. אשר את זה בהרשאות העמוד ונסה שוב.","bad",true);
  else if(c==="quota_exceeded")toast("הגעת למגבלת הנתונים. מחק קורסים ישנים כדי להוסיף חדשים.","bad");
  else toast("השמירה נכשלה ("+c+"). נסה שוב.","bad")});chains[path]=p.catch(()=>{});return p}
function setStatus(){const el=app.querySelector(".status");if(el)el.textContent=ui.status}
function people(){return TEAMS.flatMap(t=>S.people.filter(p=>p.team===t).sort((a,b)=>(a.order||0)-(b.order||0)))}
function courses(){return [...S.courses].sort((a,b)=>(a.start||"9").localeCompare(b.start||"9")||(a.title||"").localeCompare(b.title||""))}

(function init(){
  const D=JSON.parse(document.getElementById("snap").textContent);
  ui.canWrite=false;
  S.people=D.P.map(x=>({id:x.id,...x.d}));S.projects=(D.J||[]).map(x=>({id:x.id,...x.d}));S.info=(D.I||[]).map(x=>({id:x.id,...x.d}));S.courses=D.C.map(x=>({id:x.id,...x.d}));S.loaded.p=S.loaded.c=true;
  setTimeout(maybeReady,0);
})();
function maybeReady(){if(S.loaded.p&&S.loaded.c){ui.dbState="ready";if(!ui.sheet||ui.sheet.kind==="add")render()}}

/* ---------- stats ---------- */
function courseFilter(c){const q=(ui.q||"").trim().toLowerCase();if(!q)return{show:true,only:null};
  if(String(c.title||"").toLowerCase().includes(q))return{show:true,only:null};
  const ids=parts(c).filter(id=>{const p=S.people.find(x=>x.id===id);return p&&String(p.name).toLowerCase().includes(q)});
  return ids.length?{show:true,only:new Set(ids)}:{show:false,only:null}}
function searchBox(){const opts=[...people().map(p=>p.name),...courses().map(c=>c.title)];
  return `<label class="qsearch"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6 7.5V19l-4 1.5v-8z"/></svg><input id="q" type="search" list="qlist" placeholder="סינון: שם או קורס" value="${esc(ui.q||"")}" autocomplete="off" aria-label="סינון לפי שם או קורס">${ui.q?`<button type="button" class="qclr" data-act="qclr" aria-label="נקה סינון">×</button>`:""}</label><datalist id="qlist">${opts.map(o=>`<option value="${esc(o)}">`).join("")}</datalist>`}
function todayHtml(){
  const ps=people(),total=ps.length;if(!total)return"";
  let d=TODAY,lbl="היום";if(isWE(d)){while(isWE(d))d=addDays(d,1);lbl="ביום "+WD[D(d).getDay()]+"׳ הקרוב"}
  const out=[];courses().forEach(c=>{if(c.start&&c.start<=d&&endOf(c)>=d)parts(c).forEach(id=>{const p=ps.find(x=>x.id===id);if(p&&!out.some(o=>o.p===p))out.push({p,c})})});
  const here=total-out.length,r=here/total,cls=r<.5?"low":r<.75?"mid":"ok";
  return `<div class="today ${cls}"><div class="tnum"><b>${here}</b><span>/ ${total}</span></div><div class="ttx"><strong>צפויים במדור ${lbl}</strong><small>${out.length?"בחוץ: "+out.map(o=>esc(firstName(o.p.name))).join(", "):"כל המדור כאן"}</small></div></div>`}
function stayOn(d,ps,cs){const away=new Set();cs.forEach(c=>{if(c.start&&c.start<=d&&endOf(c)>=d)parts(c).forEach(id=>away.add(id))});return ps.filter(p=>!away.has(p.id)).length}
function kpisHtml(){
  const ps=people(),cs=courses().filter(c=>c.start),total=ps.length;
  const in60=addDays(TODAY,60),in90=addDays(TODAY,90);
  const upcoming=cs.filter(c=>endOf(c)>=TODAY&&c.start<=in60).length;
  const ws=addDays(TODAY,-D(TODAY).getDay()),we=addDays(ws,6);
  const out=new Set();cs.filter(c=>c.start<=we&&endOf(c)>=ws).forEach(c=>parts(c).forEach(id=>{if(ps.some(p=>p.id===id))out.add(id)}));
  let minD=null,minV=Infinity;for(let i=0;i<=90;i++){const d=addDays(TODAY,i);if(isWE(d))continue;const v=stayOn(d,ps,cs);if(v<minV){minV=v;minD=d}}
  const pdays=cs.filter(c=>endOf(c)>=TODAY&&c.start<=in90).reduce((s,c)=>s+days(c)*parts(c).filter(id=>ps.some(p=>p.id===id)).length,0);
  const tight=total&&minV/total<.5;
  return `<div class="kpis">
  <div class="kpi"><span class="k">קורסים ב-60 הימים הקרובים</span><span class="v">${upcoming}</span><span class="s">קורסים, הכשרות וכנסים</span></div>
  <div class="kpi"><span class="k">בחוץ השבוע</span><span class="v">${out.size}<small> / ${total}</small></span><span class="s">${fd(ws)} – ${fd(we)}</span></div>
  <div class="kpi${tight?" alert":""}"><span class="k">היום הכי דליל במדור</span><span class="v">${minD&&minV<total?minV+`<small> / ${total}</small>`:"—"}</span><span class="s">${minD&&minV<total?"ב-"+fd(minD):"אף אחד לא בחוץ ב-90 יום"}</span></div>
  <div class="kpi"><span class="k">ימי-אדם בהכשרה</span><span class="v">${pdays}</span><span class="s">ב-90 הימים הקרובים</span></div></div>`}

/* ---------- gantt ---------- */
function ganttHtml(){

  if(!cs.length)return `<div class="board">${tools}<div class="emptyrow">עוד אין קורסים עם תאריכים. לחץ על "+ קורס חדש" כדי לראות אותם על ציר הזמן.</div></div>`;
  const reg=cs.filter(c=>!c.bottom).length?cs.filter(c=>!c.bottom):cs;
  const live=reg.filter(c=>endOf(c)>=TODAY);
  const wk0=addDays(TODAY,-D(TODAY).getDay());const start=live.length?wk0:reg[reg.length-1].start.slice(0,7)+"-01";
  let end=reg.reduce((m,c)=>endOf(c)>m?endOf(c):m,start);
  {const d=D(end.slice(0,7)+"-01");d.setMonth(d.getMonth()+1);d.setDate(0);end=iso(d)}
  const busy=d=>true;
  const cols=[];for(let ws=addDays(start,-D(start).getDay());ws<=end&&cols.length<300;ws=addDays(ws,7)){
    if(busy(ws)){for(let k=0;k<5;k++){const d=addDays(ws,k);if(d>=start&&d<=end)cols.push({d,s:d,e:d,g:false})}}
    else if(ws>=addDays(start,-D(start).getDay())&&cols.length&&addDays(ws,4)<end)cols.push({d:ws,s:ws,e:addDays(ws,4),g:true});}
  while(cols.length&&cols[cols.length-1].g)cols.pop();
  const dayList=cols.map(c=>c.d),isGap=cols.map(c=>c.g);
  const nextWork=d=>{let x=addDays(d,1);while(isWE(x))x=addDays(x,1);return x};
  const gap=dayList.map((d,i)=>i>0&&D(d).getDay()===0);
  const jump=dayList.map(()=>false);
  const n=dayList.length;
  const first=s=>{const i=cols.findIndex(c=>c.e>=s);return i<0?n:i};
  const last=s=>{let i=-1;for(let k=0;k<n;k++)if(cols[k].s<=s)i=k;return i};
  const span=c=>{const a=first(c.start),b=last(endOf(c));return b<a?null:`grid-column:${2+a} / ${3+b}`};
  const txt=(c,pp)=>{const a=first(c.start);if(a>=n)return"";const b=Math.min(n-1,a+30);const inner=pp.length?pp.map(p=>`<span class="pc"><i>${esc(initials(p.name))}</i>${esc(firstName(p.name))}</span>`).join(""):"אין משתתפים עדיין";return `<span class="gtxt${pp.length?"":" mut"}${endOf(c)<TODAY?" past":""}" style="grid-column:${2+a} / ${3+b};grid-row:1">${inner}</span>`};
  const ti=cols.findIndex(c=>!c.g&&c.d===TODAY);
  const bg=dayList.map((d,i)=>(isGap[i]?`<div class="wk gw" style="grid-column:${2+i}"></div>`:"")+(gap[i]||isGap[i-1]?`<div class="wl gp" style="grid-column:${2+i}"></div>`:"")).join("")+(ti>=0?`<div class="tdy" style="grid-column:${2+ti}"></div>`:"");
  let months="",cur=null,from=0;
  const mcell=(m,a,b)=>`<div class="gm" style="grid-column:${2+a} / ${2+b}">${esc(D(m+"-15").toLocaleDateString("he-IL",b-a>=3?{month:"long",year:"numeric"}:{month:"short"}))}</div>`;
  dayList.forEach((d,i)=>{const m=d.slice(0,7);if(m!==cur){if(cur!==null)months+=mcell(cur,from,i);cur=m;from=i}});months+=mcell(cur,from,n);
  const dnums=dayList.map((d,i)=>isGap[i]?`<div class="gd gwd ws" style="grid-column:${2+i}" title="שבוע בלי קורסים: ${fd(cols[i].s)}–${fd(cols[i].e)}"><em>${dmy(cols[i].s)}</em></div>`:`<div class="gd${d===TODAY?" t":""}${gap[i]||jump[i]?" ws":""}${jump[i]?" jp":""}" style="grid-column:${2+i}"><i>${d===TODAY?"היום":WD[D(d).getDay()]}</i><span>${+d.slice(8)}</span></div>`).join("");
  const head=`<div class="ghead"><div class="grow" style="grid-template-rows:auto auto"><div class="glabel gsearch">${searchBox()}</div>${months}${dnums}</div></div>`;

    const a0=first(c.start);
    const everyone=total>0&&k===total;const kr=everyone?1:k;
    const b0=last(endOf(c));const tagAfter=b0+1<n;const tc=tagAfter?b0+1:first(c.start);
    const bars=!sp?"":everyone&&first(c.start)===last(endOf(c))?`<div class="gbar sbar one allone${past}" style="${sp};grid-row:2" data-course="${c.id}" title="כל המדור · ${esc(c.title)} · ${esc(range(c))}"><i class="grp"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><circle cx="16.5" cy="9" r="2.6"/><path d="M3.5 19c0-3.2 2.5-5.5 5.5-5.5s5.5 2.3 5.5 5.5"/><path d="M14 14.2c.8-.4 1.6-.6 2.5-.6 2.4 0 4.2 1.8 4.2 4.6"/></svg></i></div>`:everyone?`<div class="gbar allb${past}" style="${sp};grid-row:2" data-course="${c.id}" title="כל המדור · ${esc(c.title)} · ${esc(range(c))}"><i class="grp"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><circle cx="16.5" cy="9" r="2.6"/><path d="M3.5 19c0-3.2 2.5-5.5 5.5-5.5s5.5 2.3 5.5 5.5"/><path d="M14 14.2c.8-.4 1.6-.6 2.5-.6 2.4 0 4.2 1.8 4.2 4.6"/></svg></i><span>כל המדור</span></div>`:pp.map((p,i)=>{const a0=first(c.start),b0=last(endOf(c)),one=b0===a0,short=b0-a0<3;const x=ui.canWrite?`<button class="x" data-rm="${c.id}|${p.id}" aria-label="הסר את ${esc(p.name)} מ${esc(c.title)}" title="הסר מהקורס">×</button>`:"";

      if(one)return `<div class="gbar sbar one${past}" style="${sp};grid-row:${i+2}" data-course="${c.id}" title="${esc(p.name)} · ${esc(c.title)} · ${esc(range(c))}"><i>${esc(initials(p.name))}</i></div>`;

  const undatedHtml=c=>{if(!courseFilter(c).show)return "";const pp=parts(c).map(id=>ps.find(p=>p.id===id)).filter(Boolean);const k=pp.length;
    const extra="";
    return `<div class="grow crow" style="--c:${hue(c.id)};grid-template-rows:8px minmax(34px,auto) 8px"><div class="glabel"><button class="gl-main" data-course="${c.id}"${dis()}><i class="dot"></i><span class="tx"><b>${esc(c.title)} <span class="kc">${k}</span></b><small>${esc("עוד אין תאריכים")}</small>${extra?`<small class="ex">${esc(extra)}</small>`:""}</span></button>${ui.canWrite?`<button class="gl-add" data-add="${c.id}" aria-label="הוסף משתתף ל${esc(c.title)}" title="הוסף משתתף">+</button>`:""}</div>${bg}<button class="nodate" style="grid-column:2 / ${2+Math.min(n,14)};grid-row:2" data-course="${c.id}"${dis()}>עוד אין תאריכים · לחץ כדי לקבוע${k?` · ${esc(pp.map(p=>firstName(p.name)).join(", "))}`:""}</button></div>`};
  const body=cs.filter(c=>endOf(c)>=start&&!c.bottom).map(rowHtml).join("");
  const body2=courses().filter(c=>!c.start&&!c.bottom).map(undatedHtml).join("");
  const bodyB=courses().filter(c=>c.bottom&&(!c.start||endOf(c)>=start)).sort((a,b)=>(a.bottomRank||0)-(b.bottomRank||0)).map(c=>c.start?rowHtml(c):undatedHtml(c)).join("");
  const stayCells=dayList.map((d,i)=>{if(isGap[i])return "";if(!cs.some(c=>c.start<=d&&endOf(c)>=d))return "";const st=stayOn(d,ps,cs);const r=total?st/total:1;
    return `<div class="sc ${r<.5?"low":r<.75?"mid":""}" style="grid-column:${2+i}" title="${fd(d)}: ${st} מתוך ${total} במדור">${st}</div>`}).join("");

function tableHtml(){

  const nameRow=ps.map(p=>`<th class="${sep(p)}" scope="col"><button class="pname" data-person="${p.id}"${dis()}>${nameHtml(p.name)}</button></th>`).join("");
  const rows=cs.map(c=>{
    const others=S.courses.filter(o=>o!==c&&overlap(o,c));

  return `<div class="board"><div class="toolbar"><div class="legend"><span><i class="lg on"></i>משתתף</span><span><i class="lg cl"></i>כבר באירוע אחר באותם ימים</span></div></div><div class="tscroll"><table>

/* people view */
function splitName(p){const f=(p.first||"").trim(),l=(p.last||"").trim();if(f||l)return[f,l];const w=String(p.name||"").trim().split(/\s+/);return[w[0]||"",w.slice(1).join(" ")]}
function fmtPhone(t){const d=String(t||"").replace(/\D/g,"");return d.length===10?d.slice(0,3)+"-"+d.slice(3,6)+"-"+d.slice(6):String(t||"")}
function bdayIn(b){const m=String(b||"").match(/^(\d{1,2})[.\/](\d{1,2})/);if(!m)return null;const t=D(TODAY);let d=new Date(t.getFullYear(),+m[2]-1,+m[1]);if(d<t)d=new Date(t.getFullYear()+1,+m[2]-1,+m[1]);return Math.round((d-t)/864e5)}
const RANGE_MONTHS={live:6,laser:6},RANGE_WARN=30;const RTYPE={live:"חי",laser:"לייזר"};
const HMONTHS=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
function rangeInfo(r,type){const RANGE_M=RANGE_MONTHS[type==="laser"?"laser":"live"];const t=String(r||"").trim();
  if(!t)return{k:"none",txt:"—",tag:"חסר תאריך",short:"חסר תאריך · חובה להשלים"};
  if(/פטור/.test(t))return{k:"ex",txt:t,tag:"פטור",short:""};
  if(/^ל[״"']?ר$/.test(t))return{k:"ex",txt:t,tag:"לא רלוונטי",short:""};
  if(/בה[״"']?ד/.test(t))return{k:"ex",txt:t,tag:"בבה״ד 1",short:""};
  const m=t.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})$/);if(!m)return{k:"none",txt:t,tag:"חסר תאריך",short:"חסר תאריך · חובה להשלים"};
  let y=+m[3];if(y<100)y+=2000;const d0=new Date(y,+m[2]-1,+m[1]);const ex=new Date(y,+m[2]-1+RANGE_M,+m[1]);
  const left=Math.round((ex-D(TODAY))/864e5);const exm=HMONTHS[ex.getMonth()]+" "+ex.getFullYear();const exs=pad(ex.getDate())+"."+pad(ex.getMonth()+1)+"."+ex.getFullYear();

/* important info board */
const INFO_SUGGEST=["טלפונים","קישורים","אנשי קשר אצל לקוחות","נהלים","מספרים חשובים"];
function infoKind(v){v=String(v||"").trim();if(/^(https?:\/\/|www\.)/i.test(v))return"link";if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))return"mail";if(/^[\d\s\-+*#().]{5,}$/.test(v)&&/\d{3}/.test(v.replace(/\D/g,"")))return"phone";return"text"}
const IIC={link:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
  text:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>'};
function infoHref(v,k){v=String(v).trim();return k==="link"?(/^https?:/i.test(v)?v:"https://"+v):k==="mail"?"mailto:"+v:k==="phone"?"tel:"+v.replace(/[^\d+*#]/g,""):null}
function infoHtml(){
  const q=(ui.q||"").trim().toLowerCase();
  const items=[...S.info].sort((a,b)=>(a.order||0)-(b.order||0)).filter(x=>!q||[x.cat,x.title,x.value,x.note].some(v=>String(v||"").toLowerCase().includes(q)));
  const cats=[];items.forEach(x=>{const c=x.cat||"כללי";if(!cats.includes(c))cats.push(c)});
  if(!S.info.length)return `<div class="board"><div class="ib-empty"><div class="lki">${IIC.text}</div><h2>עוד אין כאן מידע</h2><p>מקום אחד לכל מה שחשוב למדור: טלפונים, קישורים, אנשי קשר, נהלים ומספרים שצריך לזכור.</p>${ui.canWrite?`<button class="btn primary" data-act="newinfo">+ הוסף פריט ראשון</button>`:""}<div class="ib-sug">${INFO_SUGGEST.map(c=>`<span>${esc(c)}</span>`).join("")}</div></div></div>`;
  const body=cats.map(c=>{const list=items.filter(x=>(x.cat||"כללי")===c);
    return `<section class="ib-cat"><h3>${esc(c)} <small>${list.length}</small></h3><div class="ib-grid">${list.map(x=>{const k=infoKind(x.value);const h=infoHref(x.value,k);const ic=k==="phone"?IC.phone:k==="mail"?IC.mail:IIC[k];
      return `<article class="ib-card k-${k}"><i class="ib-ic">${ic}</i><div class="ib-tx"><span class="ib-t">${esc(x.title||"")}</span>${x.value?(h?`<a class="ib-v" href="${esc(h)}"${k==="link"?' target="_blank" rel="noopener"':""} dir="${k==="text"?"auto":"ltr"}">${esc(k==="phone"?fmtPhone(x.value):x.value)}</a>`:`<b class="ib-v" dir="auto">${esc(x.value)}</b>`):""}${x.note?`<small>${esc(x.note)}</small>`:""}</div><div class="ib-act">${x.value?`<button class="pcopy" data-copy="${esc(x.value)}" title="העתק" aria-label="העתק">${IC.copy}</button>`:""}${ui.canWrite?`<button class="pcopy" data-info="${x.id}" title="עריכה" aria-label="עריכה">✎</button>`:""}</div></article>`}).join("")}</div></section>`}).join("");
  return `<div class="board"><div class="sbar2">${searchBox()}</div>${body||`<div class="qempty">אין פריטים שמתאימים לחיפוש.</div>`}</div>`}
function infoSheet(){const s=ui.sheet;const x=s.id==="new"?{cat:ui.lastCat||"",title:"",value:"",note:""}:S.info.find(i=>i.id===s.id);if(!x)return"";
  const cats=[...new Set([...S.info.map(i=>i.cat).filter(Boolean),...INFO_SUGGEST])];
  return `<div class="scrim" data-act="close"><form class="sheet" id="sheetf" role="dialog" aria-label="פריט מידע"><h2>${s.id==="new"?"פריט חדש":"עריכת פריט"}</h2>
  <label class="f">קטגוריה<input id="i-cat" list="i-cats" value="${esc(x.cat||"")}" placeholder="למשל: טלפונים"></label><datalist id="i-cats">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
  <label class="f">שם<input id="i-title" value="${esc(x.title||"")}" placeholder="למשל: מוקד מחשוב"></label>
  <label class="f">מספר / קישור / ערך<input id="i-value" value="${esc(x.value||"")}" placeholder="טלפון, קישור, מייל או כל טקסט"></label>
  <label class="f">הערה<input id="i-note" value="${esc(x.note||"")}" placeholder="אופציונלי"></label>
  ${ui.err?`<div class="err">${esc(ui.err)}</div>`:""}
  <div class="acts"><button class="btn primary" type="submit">שמור</button><button class="btn" type="button" data-act="close">ביטול</button><span class="sp"></span>${s.id!=="new"?`<button type="button" class="btn danger${ui.armed?" armed":""}" data-act="delinfo">${ui.armed?"בטוח? לחץ למחיקה":"מחק"}</button>`:""}</div></form></div>`}

function sheetHtml(){
  const s=ui.sheet;if(!s)return"";
  if(s.kind==="project")return projSheet();
  if(s.kind==="info")return infoSheet();
  if(s.kind==="add"){const c=S.courses.find(x=>x.id===s.id);if(!c)return"";
    const n=parts(c).length;
    const pick=TEAMS.map(t=>{const tp=people().filter(p=>p.team===t);return tp.length?`<div class="qg"><div class="qt">${esc(t)} ${cntHtml(tp.length)}</div><div class="ql">`+tp.map(p=>`<button type="button" class="qp" data-quick="${c.id}|${p.id}" aria-pressed="${has(c,p.id)}"><i>${esc(initials(p.name))}</i><span>${nameHtml(p.name)}</span><b aria-hidden="true">${CHECK}</b></button>`).join("")+`</div></div>`:""}).join("");
    return `<div class="scrim" data-act="close"><div class="sheet qsheet" role="dialog" aria-label="משתתפים" style="--c:${hue(c.id)}"><div class="qh"><i class="dot"></i><div><h2>${esc(c.title)}</h2><p class="sub">${n} משתתפים · לחיצה על שם מוסיפה או מורידה מיד</p></div></div>${(()=>{const rows=[["תאריכים",c.start?range(c):"עוד אין תאריכים"],["משך",dur(c)],["מיקום",c.location],["רישום עד",c.deadline?dmy(c.deadline):""],["עלות למשתתף",c.cost?money(c.cost):""],["הערות",c.note]].filter(r=>r[1]);return `<dl class="qinfo">${rows.map(r=>`<div><dt>${r[0]}</dt><dd>${esc(r[1])}</dd></div>`).join("")}</dl>${c.details?`<div class="qdet">${linkify(c.details)}</div>`:""}`})()}<div class="bulk"><button type="button" class="btn" data-all="${c.id}"${n===people().length?" disabled":""}>בחר הכל</button><button type="button" class="btn" data-clear="${c.id}"${n?"":" disabled"}>נקה הכל</button><button type="button" class="btn qe" data-course="${c.id}">עריכת פרטי הקורס</button></div>${pick}<div class="acts"><button class="btn primary" type="button" data-act="close">סיום</button></div></div></div>`}
  if(s.kind==="course"){const c=s.id==="new"?{title:"",start:"",end:"",people:{}}:S.courses.find(x=>x.id===s.id);if(!c)return"";
    const pick=TEAMS.map(t=>{const tp=people().filter(p=>p.team===t);return tp.length?`<span class="tl">${esc(t)}</span>`+tp.map(p=>`<label><input type="checkbox" name="cp" value="${p.id}"${has(c,p.id)?" checked":""}><span>${esc(p.name)}</span></label>`).join(""):""}).join("");
    return `<div class="scrim" data-act="close"><form class="sheet" id="sheetf" role="dialog" aria-label="קורס"><h2>${s.id==="new"?"קורס חדש":"עריכת קורס"}</h2>
    <label class="f">שם הקורס / הכנס<input id="c-title" value="${esc(c.title)}" placeholder="למשל: קורס Spark"></label>
    <div class="row2"><label class="f">מתאריך<input type="date" id="c-start" value="${esc(c.start)}"></label><label class="f">עד תאריך<input type="date" id="c-end" value="${esc(c.end)}"></label></div>
    <div class="row2"><label class="f">מיקום<input id="c-loc" value="${esc(c.location||"")}" placeholder="למשל: אוניברסיטת תל אביב"></label><label class="f">יום אחרון לרישום<input type="date" id="c-dl" value="${esc(c.deadline||"")}"></label></div>
    <label class="f">הערה<input id="c-note" value="${esc(c.note||"")}" placeholder="למשל: ממתין לאישור בסמ״ח"></label>
    <div class="row2"><label class="f">עלות למשתתף (₪)<input id="c-cost" type="number" min="0" step="1" inputmode="numeric" value="${esc(c.cost||"")}" placeholder="למשל: 2400"></label><label class="f chk"><span>דף סיכום הקורסים</span><span class="cb"><input type="checkbox" id="c-sum"${c.inSummary?" checked":""}> להציג בדף הסיכום</span></label></div>
    <label class="f">מידע נוסף על הקורס<textarea id="c-det" rows="5" placeholder="אפשר להדביק כאן את הודעת ההרשמה">${esc(c.details||"")}</textarea></label>
    <fieldset><legend>מי משתתף</legend><div class="pick">${pick||'<span class="tl">עוד אין אנשים במדור</span>'}</div></fieldset>
    ${ui.err?`<div class="err">${esc(ui.err)}</div>`:""}
    <div class="acts"><button class="btn primary" type="submit">שמור</button><button class="btn" type="button" data-act="close">ביטול</button><span class="sp"></span>${s.id!=="new"?`<button type="button" class="btn danger${ui.armed?" armed":""}" data-act="delc">${ui.armed?"בטוח? לחץ למחיקה":"מחק קורס"}</button>`:""}</div></form></div>`}
  const p=s.id==="new"?{name:"",team:TEAMS[0]}:S.people.find(x=>x.id===s.id);if(!p)return"";
  return `<div class="scrim" data-act="close"><form class="sheet" id="sheetf" role="dialog" aria-label="איש צוות"><h2>${s.id==="new"?"איש צוות חדש":"עריכת איש צוות"}</h2>
  <label class="f">שם מלא<input id="p-name" value="${esc(p.name)}" placeholder="שם פרטי ושם משפחה"></label>
  <label class="f">צוות<select id="p-team">${TEAMS.map(t=>`<option${t===p.team?" selected":""}>${esc(t)}</option>`).join("")}</select></label>
  <div class="row2"><label class="f">שם פרטי (לטבלת האנשים)<input id="p-first" value="${esc(p.first||"")}"></label><label class="f">שם משפחה<input id="p-last" value="${esc(p.last||"")}"></label></div>
  <div class="row2"><label class="f">ת.ז<input id="p-tz" inputmode="numeric" value="${esc(p.tz||"")}"></label><label class="f">טלפון<input id="p-phone" type="tel" dir="ltr" value="${esc(p.phone||"")}"></label></div>
  <label class="f">מייל<input id="p-email" type="email" dir="ltr" value="${esc(p.email||"")}"></label>
  <div class="row2"><label class="f">תאריך ביצוע מטווח<input id="p-range" value="${esc(p.range||"")}" placeholder="למשל: 06.01.2026 או פטור"></label><label class="f">סוג מטווח<select id="p-rtype"><option value="live"${p.rangeType!=="laser"?" selected":""}>חי (6 חודשים)</option><option value="laser"${p.rangeType==="laser"?" selected":""}>לייזר (6 חודשים)</option></select></label></div>
  <div class="row2"><label class="f">יום הולדת<input id="p-bday" value="${esc(p.bday||"")}" placeholder="יום.חודש, למשל 29.01"></label><label class="f">יתרת ימי חופש<input id="p-vac" type="number" step="0.5" inputmode="decimal" value="${p.vac??""}" placeholder="למשל: 12"></label></div>
  ${ui.err?`<div class="err">${esc(ui.err)}</div>`:""}
  <div class="acts"><button class="btn primary" type="submit">שמור</button><button class="btn" type="button" data-act="close">ביטול</button><span class="sp"></span>${s.id!=="new"?`<button type="button" class="btn danger${ui.armed?" armed":""}" data-act="delp">${ui.armed?"בטוח? לחץ להסרה":"הסר מהמדור"}</button>`:""}</div></form></div>`}

/* ---------- render ---------- */
function render(){
  let main;const ready=ui.dbState==="ready";
  if(ui.dbState==="loading")main=`<div class="board"><div class="loading">טוען את הנתונים…</div></div>`;
  else if(ui.dbState==="none")main=`<div class="board"><div class="loading">הנתונים המשותפים לא זמינים בתצוגה הזו. פתח את העמוד מתוך Claude כשאתה מחובר.</div></div>`;
  else if(ui.dbState==="error")main=`<div class="board"><div class="loading">החיבור לנתונים נקטע. רענן את העמוד.</div></div>`;
  else main=ui.view==="summary"?summaryHtml():ui.view==="people"?peopleHtml():ui.view==="projects"?projectsHtml():ui.view==="info"?infoHtml():ganttHtml();
  const nSample=S.courses.filter(c=>c.sample).length;
  const gs=document.getElementById("gboard")?.scrollLeft,gs2=document.getElementById("gboard2")?.scrollLeft;
  app.innerHTML=`<header><div class="htitle" dir="ltr"><div class="eyebrow" dir="rtl"><i></i>תכנון הכשרות, קורסים וכנסים</div><h1>DS <em>DEPARTMENT</em></h1></div>${ready?todayHtml():""}
  <div class="hright"><span class="status">עודכן 11.11.2026 · תצוגה בלבד</span>
    <div class="seg" role="group" aria-label="תצוגה"><button data-view="gantt" aria-pressed="${ui.view==="gantt"}">קורסים</button><button data-view="summary" aria-pressed="${ui.view==="summary"}">סיכום קורסים</button><button data-view="info" aria-pressed="${ui.view==="info"}">מידע חשוב</button>${ui.peopleTab!==false?`<button data-view="people" aria-pressed="${ui.view==="people"}">אנשים</button>`:""}<button data-view="projects" aria-pressed="${ui.view==="projects"}">פרויקטים</button></div>
    ${ui.canWrite&&ready?(ui.view==="info"?`<button class="btn primary" data-act="newinfo">+ פריט חדש</button>`:ui.view==="projects"?`<button class="btn primary" data-act="newproj">+ פרויקט חדש</button>`:ui.view==="people"?`<button class="btn primary" data-act="newp">+ איש צוות</button>`:`<button class="btn primary" data-act="newc">+ קורס חדש</button>`):""}</div></header>
  
  ${ready&&nSample&&ui.canWrite?`<div class="note"><span>${nSample} מהקורסים כאן הם דוגמה (מסומנים "דוגמה"). ערוך אותם או מחק את כולם כשתתחיל להכניס קורסים אמיתיים.</span><button class="btn" data-act="clear">${ui.clearArmed?"בטוח? לחץ שוב":"מחק קורסי דוגמה"}</button></div>`:""}
  ${main}${sheetHtml()}`;
  const f=app.querySelector(".sheet input");if(f&&ui.focus){f.focus();ui.focus=false}
  const g=document.getElementById("gboard");
  if(g&&ready){if(!ui.scrolled){const t=document.getElementById("g-today");if(t){ui.scrolled=true;const lw=parseFloat(getComputedStyle(g.firstElementChild).getPropertyValue("--lw"))||236;const br=g.getBoundingClientRect(),tr=t.getBoundingClientRect();g.scrollLeft+=tr.right-(br.right-lw-150)}}else if(gs!=null)g.scrollLeft=gs}
  const g2=document.getElementById("gboard2");if(g2&&gs2!=null)g2.scrollLeft=gs2;
}

function open(kind,id){if(!ui.canWrite)return;ui.sheet={kind,id};ui.armed=false;ui.err="";ui.focus=true;render()}
function close(){ui.sheet=null;render()}
app.addEventListener("click",e=>{
  if(e.target.classList&&e.target.classList.contains("scrim")){close();return}
  const b=e.target.closest("button,.gbar[data-course]");if(!b||b.disabled)return;
  if(b.dataset.rm){if(!db)return;const[cid,pid]=b.dataset.rm.split("|");write("courses/"+cid,()=>db.doc("courses/"+cid).update({people:{[pid]:false}}));return}
  if(b.dataset.add){open("add",b.dataset.add);return}
  if(b.dataset.all||b.dataset.clear){if(!db)return;const cid=b.dataset.all||b.dataset.clear;const on=!!b.dataset.all;const pm={};people().forEach(p=>pm[p.id]=on);write("courses/"+cid,()=>db.doc("courses/"+cid).update({people:pm}));return}
  if(b.dataset.quick){if(!db)return;const[cid,pid]=b.dataset.quick.split("|");const c=S.courses.find(x=>x.id===cid);if(!c)return;const on=!has(c,pid);b.setAttribute("aria-pressed",String(on));write("courses/"+cid,()=>db.doc("courses/"+cid).update({people:{[pid]:on}}));return}
  if(b.dataset.pexp){ui.pOpen=ui.pOpen||{};ui.pOpen[b.dataset.pexp]=!ui.pOpen[b.dataset.pexp];render();return}
  if(b.dataset.copy!==undefined){const v=b.dataset.copy;try{navigator.clipboard.writeText(v).then(()=>toast("הועתק ✓","ok"),()=>toast("לא הצלחתי להעתיק","bad"))}catch(x){toast("לא הצלחתי להעתיק","bad")}return}
  if(b.dataset.rtype){if(!db||!ui.canWrite)return;const[id,nt]=b.dataset.rtype.split("|");const p=S.people.find(x=>x.id===id);if(!p||(p.rangeType||"live")===nt)return;p.rangeType=nt;render();write("people/"+id,()=>db.doc("people/"+id).update({rangeType:nt}));return}
  if(b.dataset.rf!==undefined){ui.rf=ui.rf===b.dataset.rf?"":b.dataset.rf;render();return}
  if(b.dataset.view){ui.view=b.dataset.view;ui.scrolled=false;try{history.replaceState(null,"",ui.view!=="gantt"?"#"+ui.view:location.pathname+location.search)}catch(x){}render();return}
  if(b.dataset.gmode){ui.gmode=b.dataset.gmode;try{localStorage.setItem("ds-gmode",ui.gmode)}catch(x){}render();return}
  if(b.dataset.tog){if(!db||!ui.canWrite)return;const[cid,pid]=b.dataset.tog.split("|");const c=S.courses.find(x=>x.id===cid);if(!c)return;
    const on=!has(c,pid);b.setAttribute("aria-pressed",String(on));
    write("courses/"+cid,()=>db.doc("courses/"+cid).update({people:{[pid]:on}}));return}
  if(b.dataset.course){open("course",b.dataset.course);return}
  if(b.dataset.person){open("person",b.dataset.person);return}
  if(b.dataset.info){open("info",b.dataset.info);return}
  if(b.dataset.proj){const p=S.projects.find(x=>x.id===b.dataset.proj);if(!p||!ui.canWrite)return;ui.pedit=JSON.parse(JSON.stringify(p));open("project",p.id);return}
  if(b.dataset.ptog){ui.pjCol[b.dataset.ptog]=!ui.pjCol[b.dataset.ptog];render();return}
  if(b.dataset.padd){pjRead();(ui.pedit.phases=ui.pedit.phases||[]).push({k:"p2",start:"",end:"",label:""});ui.focus=false;render();return}
  if(b.dataset.prm!==undefined){pjRead();ui.pedit.phases.splice(+b.dataset.prm,1);render();return}
  if(b.dataset.madd){pjRead();(ui.pedit.milestones=ui.pedit.milestones||[]).push({date:"",label:""});render();return}
  if(b.dataset.mrm!==undefined){pjRead();ui.pedit.milestones.splice(+b.dataset.mrm,1);render();return}
  const a=b.dataset.act;
  if(a==="qclr"){ui.q="";render();const n=document.getElementById("q");if(n)n.focus();return}
  if(a==="newc"){open("course","new");return}
  if(a==="newp"){open("person","new");return}
  if(a==="newinfo"){open("info","new");return}
  if(a==="delinfo"){if(!ui.armed){ui.armed=true;render();return}const id=ui.sheet.id;ui.sheet=null;write("info/"+id,()=>db.doc("info/"+id).delete());render();return}
  if(a==="newproj"){ui.pedit={name:"",team:"insight",status:"dev",note:"",people:[],phases:[{k:"p1",start:"",end:"",label:""}],milestones:[]};open("project","new");return}
  if(a==="delproj"){if(!ui.armed){ui.armed=true;render();return}const id=ui.sheet.id;ui.sheet=null;write("projects/"+id,()=>db.doc("projects/"+id).delete());render();return}
  if(a==="close"){close();return}
  if(a==="clear"){if(!ui.clearArmed){ui.clearArmed=true;render();return}ui.clearArmed=false;S.courses.filter(c=>c.sample).forEach(c=>write("courses/"+c.id,()=>db.doc("courses/"+c.id).delete()));return}
  if(a==="delc"){if(!ui.armed){ui.armed=true;render();return}const id=ui.sheet.id;ui.sheet=null;write("courses/"+id,()=>db.doc("courses/"+id).delete());render();return}
  if(a==="delp"){if(!ui.armed){ui.armed=true;render();return}const id=ui.sheet.id;ui.sheet=null;write("people/"+id,()=>db.doc("people/"+id).delete());render();return}
});
app.addEventListener("change",e=>{const id=e.target.dataset&&e.target.dataset.vac;if(!id||!db||!ui.canWrite)return;const raw=e.target.value.trim();const v=raw===""?null:Number(raw);if(raw!==""&&!isFinite(v))return;const p=S.people.find(x=>x.id===id);if(p)p.vac=v;write("people/"+id,()=>db.doc("people/"+id).update({vac:v}));});
app.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.vac)e.target.blur()});
app.addEventListener("input",e=>{if(e.target.id!=="q")return;const el=e.target,pos=el.selectionStart;ui.q=el.value;render();const n=document.getElementById("q");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&e.target&&e.target.id==="q"&&ui.q){ui.q="";render();return}if(e.key==="Escape"&&ui.sheet)close()});
app.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="unlockf"){const v=document.getElementById("upw").value;if(!v)return;ui.lockBusy=true;ui.lockErr="";render();unlock(v);return}if(e.target.id!=="sheetf"||!db)return;const g=i=>document.getElementById(i).value.trim();const s=ui.sheet;
  if(s.kind==="info"){const d={cat:g("i-cat")||"כללי",title:g("i-title"),value:g("i-value"),note:g("i-note")};if(!d.title&&!d.value){ui.err="צריך לפחות שם או ערך";render();return}ui.lastCat=d.cat;
    if(s.id==="new"){const ref=db.collection("info").doc();write("info/"+ref.id,()=>ref.set({...d,order:Date.now()}))}else write("info/"+s.id,()=>db.doc("info/"+s.id).update(d));
    ui.sheet=null;render();return}
  if(s.kind==="project"){pjRead();const p=ui.pedit;if(!p.name){ui.err="צריך לתת שם לפרויקט";render();return}
    p.phases=p.phases.filter(x=>x.start).map(x=>({...x,end:x.end&&x.end>=x.start?x.end:x.start}));p.milestones=p.milestones.filter(x=>x.date);
    const data={name:p.name,team:p.team,status:p.status,note:p.note,people:p.people,open:p.open,phases:p.phases,milestones:p.milestones,draftDates:false};
    if(s.id==="new"){const ref=db.collection("projects").doc();write("projects/"+ref.id,()=>ref.set({...data,order:Date.now()}))}
    else write("projects/"+s.id,()=>db.doc("projects/"+s.id).update(data));
    ui.sheet=null;ui.pedit=null;render();return}
  if(s.kind==="course"){const t=g("c-title");if(!t){ui.err="צריך לתת שם לקורס";render();return}
    const st=g("c-start");let en=g("c-end");if(en&&st&&en<st)en=st;if(!en)en=st;
    const checked=new Set([...app.querySelectorAll('input[name="cp"]:checked')].map(x=>x.value));
    const pm={};people().forEach(p=>pm[p.id]=checked.has(p.id));
    const ext={location:g("c-loc"),deadline:g("c-dl"),note:g("c-note"),details:document.getElementById("c-det").value.trim(),cost:Number(g("c-cost"))||0,inSummary:document.getElementById("c-sum").checked};
    if(s.id==="new"){const ref=db.collection("courses").doc();write("courses/"+ref.id,()=>ref.set({title:t,start:st,end:en,people:pm,...ext,created:Date.now()}))}
    else write("courses/"+s.id,()=>db.doc("courses/"+s.id).update({title:t,start:st,end:en,people:pm,...ext,sample:false}))}
  else{const n=g("p-name");if(!n){ui.err="צריך שם";render();return}const team=document.getElementById("p-team").value;const px={first:g("p-first"),last:g("p-last"),tz:g("p-tz"),phone:g("p-phone"),email:g("p-email"),range:g("p-range"),rangeType:document.getElementById("p-rtype").value,bday:g("p-bday"),vac:g("p-vac")===""?null:Number(g("p-vac"))};
    if(s.id==="new"){const ref=db.collection("people").doc();write("people/"+ref.id,()=>ref.set({name:n,team,...px,order:Date.now()}))}
    else write("people/"+s.id,()=>db.doc("people/"+s.id).update({name:n,team,...px}))}
  ui.sheet=null;render()});
})();
</script>

<script>
(function(){var B="1794384649";
function check(){if(document.hidden)return;fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.text():""}).then(function(t){var m=t.match(/name="build" content="([^"]+)"/);if(m&&m[1]!==B)location.reload()}).catch(function(){})}
setInterval(check,30000);document.addEventListener("visibilitychange",check);})();
</script>
